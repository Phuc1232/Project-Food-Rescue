openapi: 3.0.3
info:
  title: FoodRescue Starter API
  version: 0.1.0
  description: Only implemented endpoints. Business APIs will be added with authentication.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Verify backend and database connectivity
      responses:
        '200':
          description: Backend and database available
          content:
            application/json:
              schema:
                type: object
                required: [service, status, database]
                properties:
                  service: {type: string, example: FoodRescue}
                  status: {type: string, enum: [UP]}
                  database: {type: string, enum: [UP]}
        '503':
          description: Database temporarily unavailable
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: {type: string, example: SERVICE_UNAVAILABLE}
                  message: {type: string}
  /actuator/health:
    get:
      operationId: health
      summary: Spring Boot health indicator without internal details
      responses:
        '200': {description: Healthy}
        '503': {description: Unhealthy}
