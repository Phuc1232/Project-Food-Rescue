              "examples": {
                "two": {
                  "value": {
                    "batchId": "8b0c6f1e-2a4d-4c3b-9e7f-1d2c3b4a5e6f",
                    "quantity": 2,
                    "acceptedPolicyVersion": 1
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Order placed",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OrderView"
                }
              }
            }
          },
          "200": {
