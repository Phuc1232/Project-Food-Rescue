        "description": "Only a SUBMITTED revision can be decided; a second decision returns 409 (reload to see the result). `reason` is required for REJECT and REQUEST_INFO. APPROVE activates the store and makes the applicant its owner; selling still requires opening a sale batch. Admins cannot decide their own application.",
