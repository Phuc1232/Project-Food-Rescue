    "/api/v1/partner-applications": {
      "post": {
        "operationId": "post_partner_applications",
        "tags": [
          "Partner applications"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "summary": "Submit or resubmit a partner (store) application",
        "description": "Upload documents first with POST /api/v1/files and reference their ids. Required document types: BUSINESS_REGISTRATION, FOOD_SAFETY (optional: STOREFRONT_PHOTO, OTHER). Returns 201 for a new revision; returns 200 with the existing revision unchanged when one is already awaiting review. Resubmission after NEEDS_INFO or REJECTED creates the next revision. A pending store grants no owner rights.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PartnerApplicationRequest"
              },
              "examples": {
                "submit": {
                  "summary": "New application",
                  "value": {
                    "storeName": "Bánh mì Cô Ba",
                    "address": "12 Lê Lợi, Quận 1, TP.HCM",
                    "latitude": 10.7769,
                    "longitude": 106.7009,
                    "timezone": "Asia/Ho_Chi_Minh",
                    "contactPhone": "0901234567",
                    "businessDescription": "Bánh mì, bánh ngọt",
                    "openingHours": [
                      {
                        "dayOfWeek": 1,
                        "opensAt": "06:00",
                        "closesAt": "21:00"
                      },
                      {
                        "dayOfWeek": 5,
                        "opensAt": "18:00",
                        "closesAt": "01:00"
                      }
                    ],
                    "documents": [
                      {
                        "type": "BUSINESS_REGISTRATION",
                        "fileId": "00000000-0000-0000-0000-000000000001"
                      },
                      {
                        "type": "FOOD_SAFETY",
                        "fileId": "00000000-0000-0000-0000-000000000002"
                      }
                    ]
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "New revision submitted",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MyPartnerApplicationResponse"
                }
              }
            }
          },
          "200": {
            "description": "A revision is already awaiting review; returned unchanged",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MyPartnerApplicationResponse"
                }
              }
            }
          },
          "400": {
            "description": "VALIDATION_FAILED with field errors, or INVALID_REQUEST for malformed JSON",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                },
                "examples": {
                  "missingDocument": {
                    "value": {
                      "code": "VALIDATION_FAILED",
                      "message": "Invalid request",
                      "requestId": "3f2c1a9e-0b7d-4e6a-9c1f-2d8e5b4a7c60",
                      "timestamp": "2026-11-14T08:00:00Z",
                      "fieldErrors": [
                        {
                          "field": "documents",
                          "message": "Missing required document: FOOD_SAFETY"
                        }
                      ]
                    }
                  },
                  "overlappingShift": {
                    "value": {
                      "code": "VALIDATION_FAILED",
                      "message": "Invalid request",
                      "requestId": "3f2c1a9e-0b7d-4e6a-9c1f-2d8e5b4a7c60",
                      "timestamp": "2026-11-14T08:00:00Z",
                      "fieldErrors": [
                        {
                          "field": "openingHours[1]",
                          "message": "Shift overlaps openingHours[0]"
                        }
                      ]
                    }
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "409": {
            "description": "CONFLICT: the account already owns a store",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                },
                "examples": {
                  "ownsStore": {
                    "value": {
                      "code": "CONFLICT",
                      "message": "Account already owns a store",
                      "requestId": "3f2c1a9e-0b7d-4e6a-9c1f-2d8e5b4a7c60",
                      "timestamp": "2026-11-14T08:00:00Z",
                      "fieldErrors": []
                    }
                  }
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        }
      }
    },
