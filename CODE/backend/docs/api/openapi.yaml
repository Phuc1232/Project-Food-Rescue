    "/api/v1/files": {
      "post": {
        "operationId": "post_files",
        "tags": [
          "Files"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "summary": "Upload one file (JPEG, PNG, WebP or PDF)",
        "description": "The type is detected from the file content; the declared Content-Type and file extension are ignored. Maximum size is configurable (default 10 MB). A new file is visible only to its uploader until another feature attaches it. Quota: 30 uploads per 15 minutes per account.",
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "required": [
                  "file"
                ],
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary"
                  }
                }
              },
              "encoding": {
                "file": {
                  "contentType": "image/jpeg, image/png, image/webp, application/pdf"
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              },
              "Location": {
                "schema": {
                  "type": "string",
                  "format": "uri"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/FileResponse"
                }
              }
            }
          },
          "400": {
            "description": "VALIDATION_FAILED on field `file` (missing, empty, unsupported type, too large) or INVALID_REQUEST",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApiError"
                },
                "examples": {
                  "unsupportedType": {
                    "value": {
                      "code": "VALIDATION_FAILED",
                      "message": "Invalid request",
                      "requestId": "3f2c1a9e-0b7d-4e6a-9c1f-2d8e5b4a7c60",
                      "timestamp": "2026-11-14T08:00:00Z",
                      "fieldErrors": [
                        {
                          "field": "file",
                          "message": "Unsupported file type"
                        }
                      ]
                    }
                  },
                  "tooLarge": {
                    "value": {
                      "code": "VALIDATION_FAILED",
                      "message": "Invalid request",
                      "requestId": "3f2c1a9e-0b7d-4e6a-9c1f-2d8e5b4a7c60",
                      "timestamp": "2026-11-14T08:00:00Z",
                      "fieldErrors": [
                        {
                          "field": "file",
                          "message": "File exceeds 10485760 bytes"
                        }
                      ]
                    }
                  },
                  "missing": {
                    "value": {
                      "code": "VALIDATION_FAILED",
                      "message": "Invalid request",
                      "requestId": "3f2c1a9e-0b7d-4e6a-9c1f-2d8e5b4a7c60",
                      "timestamp": "2026-11-14T08:00:00Z",
                      "fieldErrors": [
                        {
                          "field": "file",
                          "message": "File is required"
                        }
                      ]
                    }
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "429": {
            "$ref": "#/components/responses/Error429"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          },
          "503": {
            "description": "SERVICE_UNAVAILABLE: file storage is unavailable",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
