    "/api/v1/admin/accounts/{id}/status": {
      "post": {
        "operationId": "post_admin_accounts_id_status",
        "tags": [
          "Admin accounts"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "summary": "Lock or unlock an account (ADMIN)",
        "description": "LOCK: ACTIVE -> LOCKED, effective on the account's next request; all sessions are revoked. Accounts with unfinished orders (as customer or store owner) need `outstandingPlan`, otherwise 409 OUTSTANDING_WORK with counts in fieldErrors (customerOrders, storeOrders). UNLOCK: LOCKED -> ACTIVE; stores, roles and staff assignments are not changed. Admins cannot change their own status.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "Account id"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AccountStatusRequest"
              },
              "examples": {
                "lock": {
                  "value": {
                    "action": "LOCK",
                    "reason": "Gian lận thanh toán nhiều lần"
                  }
                },
                "lockWithPlan": {
                  "value": {
                    "action": "LOCK",
                    "reason": "Vi phạm",
                    "outstandingPlan": "Admin liên hệ khách, hủy/hoàn các đơn còn lại"
                  }
                },
                "unlock": {
                  "value": {
                    "action": "UNLOCK",
                    "reason": "Đã xác minh lại danh tính"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "New state",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AdminAccountDetail"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "409": {
            "description": "CONFLICT (wrong current status) or OUTSTANDING_WORK",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
