  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "RegisterRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "email",
          "password",
          "displayName"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email",
            "maxLength": 255,
            "example": "developer@example.test"
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 128,
            "description": "Unicode code points; no trim or truncation",
            "example": "Example-only-password-123!",
            "format": "password",
            "writeOnly": true
          },
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255,
            "example": "Demo Customer"
          }
        }
      },
      "LoginRequest": {
        "type": "object",
        "additionalProperties": false,
