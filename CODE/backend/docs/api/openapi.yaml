          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "409": {
            "description": "NOT_ENOUGH_BOXES (fieldErrors quantity = available), BATCH_NOT_OPEN, ORDER_DEADLINE_PASSED, STORE_NOT_ACTIVE, POLICY_CHANGED, OWN_STORE, IDEMPOTENCY_KEY_REUSED",
