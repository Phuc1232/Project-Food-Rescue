          }
        ],
        "summary": "Place an order and hold boxes",
        "description": "Re-checks everything, creates a PENDING_PAYMENT order with a full snapshot (BR-33) and holds exactly `quantity` real boxes for 10 minutes, or nothing (UC-13 E1). Resending the same Idempotency-Key returns the same order with 200.",
