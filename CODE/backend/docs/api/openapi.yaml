                    "items": [
                      {
                        "menuItemId": "8b0c6f1e-2a4d-4c3b-9e7f-1d2c3b4a5e6f",
                        "quantity": 2,
                        "expiresAt": "2026-11-16T13:00:00Z",
                        "expectedUnitPrice": 25000
                      }
