spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: foodrescue-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodrescue_db}
    username: ${DB_USER:foodrescue}
    password: ${DB_PASSWORD:1234}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none

# Authentication secrets have no default, including development.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
auth:
  session-ttl: ${AUTH_SESSION_TTL:7d}
  reset-ttl: ${AUTH_RESET_TTL:15m}
  verify-ttl: ${AUTH_VERIFY_TTL:24h}
  action-base-url: ${AUTH_ACTION_BASE_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:noreply@foodrescue.local}
  rate-limit-key-secret: ${RATE_LIMIT_KEY_SECRET}
  trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
  cors-origins: ${CORS_ORIGINS:}
  jwt:
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    key-id: ${JWT_KEY_ID}
    issuer: ${JWT_ISSUER:foodrescue}
    audience: ${JWT_AUDIENCE:foodrescue-api}
    access-ttl: ${JWT_ACCESS_TTL:15m}
