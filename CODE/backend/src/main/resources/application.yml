spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: foodrescue-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodrescue_db}
    username: ${DB_USER:foodrescue}
    password: ${DB_PASSWORD:1234}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
  servlet:
    multipart:
      # T3.1: hard cap per request; the per-file business limit is files.max-size.
      max-file-size: -1
      max-request-size: ${FILE_MAX_REQUEST_SIZE:12MB}
files:
  storage-dir: ${FILE_STORAGE_DIR:${user.home}/.foodrescue/files}
  max-size: ${FILE_MAX_SIZE:10MB}
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none

# Authentication secrets have no default, including development.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
auth:
  session-ttl: ${AUTH_SESSION_TTL:7d}
  reset-ttl: ${AUTH_RESET_TTL:15m}
  verify-ttl: ${AUTH_VERIFY_TTL:24h}
  action-base-url: ${AUTH_ACTION_BASE_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:noreply@foodrescue.local}
  rate-limit-key-secret: ${RATE_LIMIT_KEY_SECRET}
  trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
  cors-origins: ${CORS_ORIGINS:}
  jwt:
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    key-id: ${JWT_KEY_ID}
    issuer: ${JWT_ISSUER:foodrescue}
    audience: ${JWT_AUDIENCE:foodrescue-api}
    access-ttl: ${JWT_ACCESS_TTL:15m}
# T6.1: payment provider. fake = in-memory (local/tests); payos needs the three keys from .env (never committed).
payment:
  gateway: ${PAYMENT_GATEWAY:fake}
pickup:
  code:
    active-key-id: ${PICKUP_CODE_ACTIVE_KEY_ID:}
    keys: ${PICKUP_CODE_KEYS:}
    backfill-enabled: false
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
  return-url: ${PAYOS_RETURN_URL:http://localhost:3000/payment/return}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/payment/cancel}
  connect-timeout: ${PAYOS_CONNECT_TIMEOUT:5s}
  read-timeout: ${PAYOS_READ_TIMEOUT:10s}
