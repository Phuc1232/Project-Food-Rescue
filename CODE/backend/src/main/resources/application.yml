spring:
  application:
    name: foodrescue-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodrescue_db}
    username: foodrescue
    password: 1234
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
