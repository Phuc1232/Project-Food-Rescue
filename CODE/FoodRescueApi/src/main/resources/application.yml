spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: ${MAIL_TEST_CONNECTION:false}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.ssl.protocols: TLSv1.2 TLSv1.3
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: foodrescue
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodrescue}
    username: ${DB_USER:foodrescue}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  forward-headers-strategy: none
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
foodrescue:
  auth:
    signing-key: ${AUTH_SIGNING_KEY}
    challenge-key: ${AUTH_CHALLENGE_KEY}
    issuer: ${AUTH_ISSUER:foodrescue-api}
  mail:
    mode: ${MAIL_MODE:sandbox}
    from: ${MAIL_FROM:FoodRescue <no-reply@foodrescue.test>}
